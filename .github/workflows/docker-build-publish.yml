name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 🔽 1. Baja el código
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔽 2. Configura Java para Maven
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 🔽 3. Compilar el proyecto con Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 🔽 4. Login a DockerHub
      - name: Docker Hub Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login --username "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 🔽 5. Build Docker image
      - name: Build Docker image
        run: docker build -t alonsodaniel1591/api-for-azure:${{ github.sha }} .

      # 🔽 6. Push Docker image
      - name: Push Docker image
        run: docker push alonsodaniel1591/api-for-azure:${{ github.sha }}

      # 🔽 7. Optional: also tag "latest"
      - name: Tag as latest
        run: |
          docker tag alonsodaniel1591/api-for-azure:${{ github.sha }} alonsodaniel1591/api-for-azure:latest
          docker push alonsodaniel1591/api-for-azure:latest